# Builds the companion downloads and publishes them as a GitHub release v<VERSION>
# (VERSION from companion/tf3map_server.py). Runs on a push to the "release" branch,
# or by hand: Actions tab -> release -> Run workflow.
name: release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==6.11.1
      # one folder instead of one file: starts faster and antivirus flags it far less often
      - run: pyinstaller --noconfirm --onedir --console --name "TF3 Minimap" --add-data "companion/web;web" companion/tf3map_server.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/TF3 Minimap

  release:
    needs: windows-exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: "build/TF3 Minimap"
      - name: Version
        id: v
        run: echo "version=$(grep -oP '^VERSION = "\K[^"]+' companion/tf3map_server.py)" >> "$GITHUB_OUTPUT"
      - name: Pack the downloads
        run: |
          mkdir -p out
          cp docs/companion-readme.txt "build/TF3 Minimap/README.txt"
          (cd build && zip -qr "../out/TF3-Minimap-Windows.zip" "TF3 Minimap")
          mkdir -p "pack/TF3 Minimap"
          cp -r companion/. "pack/TF3 Minimap/"
          cp docs/companion-readme.txt "pack/TF3 Minimap/README.txt"
          chmod +x "pack/TF3 Minimap/Start Minimap (Mac).command" "pack/TF3 Minimap/start-minimap-linux.sh"
          (cd pack && zip -qr "../out/TF3-Minimap-Mac-Linux.zip" "TF3 Minimap")
          (cd mod && zip -qr "../out/tf3_minimap-mod-manual-install.zip" tf3_minimap -x "tf3_minimap/_metadata/mod.io_fileid.txt")
      - name: Release notes from CHANGELOG.md
        run: |
          V="${{ steps.v.outputs.version }}"
          awk -v v="$V" '/^## /{ if (f) exit; if ($2 == v) { f = 1; next } } f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $V - add one (with 'What you need to do')"; exit 1; fi
          {
            echo
            echo "---"
            echo "**Downloads**: Windows - \`TF3-Minimap-Windows.zip\` (start \`TF3 Minimap.exe\`, no Python needed). Mac / Linux / Steam Deck - \`TF3-Minimap-Mac-Linux.zip\` (needs Python 3). The mod itself: [Minimap Companion on mod.io](https://mod.io/g/transportfever3/m/minimap-companion)."
            echo "Setup and troubleshooting: README.txt inside the zip."
          } >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: TF3 Minimap ${{ steps.v.outputs.version }}
          files: out/*.zip
          body_path: notes.md
